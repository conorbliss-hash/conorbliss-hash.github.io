<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 214" width="380" height="214" role="img" aria-label="Three tapering blocks narrowing left to right, from 23 down to 2.">
  <style>
    svg {
      --ink:#14181D; --ink-2:#4E555F; --ink-3:#888E96; --surface:#FCFCFB;
      --dg-line:#1F4D7A; --dg-fill:#E6EDF3; --dg-sq:#8FAAC4;
      --dg-amber:#9C6F26; --dg-amber-fill:#EFE0C4;
      --dg-z1:#E5EBF1; --dg-z2:#F1F4F6; --dg-z3:#D3DEE9;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --ink:#E9E9E6; --ink-2:#A1A6AD; --ink-3:#70767E; --surface:#191B1F;
        --dg-line:#7FA8CE; --dg-fill:#1A2632; --dg-sq:#4A6580;
        --dg-amber:#C9974A; --dg-amber-fill:#3A2F1B;
        --dg-z1:#1B2531; --dg-z2:#16191E; --dg-z3:#21303E;
      }
    }
    text { font-family: "IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif; }
  </style>
  <polygon points="40,48 146,66 146,148 40,166" fill="var(--dg-fill)" stroke="var(--dg-line)" stroke-width="2.5"/>
  <text x="93" y="119" font-size="34" text-anchor="middle" fill="var(--dg-line)">23</text>
  <polygon points="166,74 262,88 262,126 166,140" fill="var(--dg-sq)" stroke="var(--dg-line)" stroke-width="2.5"/>
  <polygon points="282,86 344,98 344,116 282,128" fill="var(--dg-line)" stroke="var(--dg-line)" stroke-width="2.5"/>
  <text x="313" y="115" font-size="22" text-anchor="middle" fill="var(--surface)">2</text>
</svg>
