<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 214" width="380" height="214" role="img" aria-label="Three tapering blocks narrowing left to right, from more than twenty down to fewer than three.">
  <style>
    svg {
      --surface:#FCFCFB;
      --dg-line:#1F4D7A; --dg-fill:#E6EDF3; --dg-sq:#8FAAC4;
    }
    @media (prefers-color-scheme: dark) {
      svg { --surface:#191B1F; --dg-line:#7FA8CE; --dg-fill:#1A2632; --dg-sq:#4A6580; }
    }
    text { font-family: "IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif; }
  </style>
  <polygon points="40,48 146,66 146,148 40,166" fill="var(--dg-fill)" stroke="var(--dg-line)" stroke-width="2.5"/>
  <text x="93" y="119" font-size="33" text-anchor="middle" fill="var(--dg-line)">20+</text>
  <polygon points="166,74 258,88 258,126 166,140" fill="var(--dg-sq)" stroke="var(--dg-line)" stroke-width="2.5"/>
  <polygon points="278,84 348,98 348,118 278,132" fill="var(--dg-line)" stroke="var(--dg-line)" stroke-width="2.5"/>
  <text x="313" y="116" font-size="22" text-anchor="middle" fill="var(--surface)">&lt;3</text>
</svg>
