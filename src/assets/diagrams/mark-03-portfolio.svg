  </style>
  <polygon points="40,48 146,66 146,148 40,166" fill="var(--dg-fill)" stroke="var(--dg-line)" stroke-width="2.5"/>
  <polygon points="166,74 262,88 262,126 166,140" fill="var(--dg-sq)" stroke="var(--dg-line)" stroke-width="2.5"/>
