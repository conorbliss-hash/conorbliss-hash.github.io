<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="Three access tiers — restricted, shared and a protected core. Data from outside passes de-identification and tokenisation into the core; it returns outward through the tiers and through a re-scoping control before leaving.">
  <style>
    svg {
      --ink:#14181D; --ink-2:#4E555F; --ink-3:#888E96; --surface:#FCFCFB;
      --dg-line:#1F4D7A; --dg-sq:#8FAAC4;
      --dg-amber:#9C6F26; --dg-amber-fill:#EFE0C4;
      --dg-z1:#E5EBF1; --dg-z2:#F1F4F6; --dg-z3:#D3DEE9;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --ink:#E9E9E6; --ink-2:#A1A6AD; --ink-3:#70767E; --surface:#191B1F;
        --dg-line:#7FA8CE; --dg-sq:#4A6580;
        --dg-amber:#C9974A; --dg-amber-fill:#3A2F1B;
        --dg-z1:#1B2531; --dg-z2:#16191E; --dg-z3:#21303E;
      }
    }
    text { font-family: "IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif; }
  </style>

  <rect x="20" y="140" width="80" height="110" rx="3" fill="none" stroke="var(--dg-line)" stroke-width="2.5"/>
  <text x="60" y="200" font-size="14" text-anchor="middle" fill="var(--ink)">External</text>

  <rect x="200" y="70" width="200" height="200" rx="4" fill="var(--dg-z1)" stroke="var(--dg-line)" stroke-width="2"/>
  <rect x="440" y="70" width="200" height="200" rx="4" fill="var(--dg-z2)" stroke="var(--dg-sq)" stroke-width="2"/>
  <rect x="680" y="70" width="240" height="200" rx="4" fill="var(--dg-z3)" stroke="var(--dg-line)" stroke-width="3"/>

  <g font-size="12" letter-spacing="2.2" fill="var(--ink-3)">
    <text x="200" y="54">RESTRICTED</text>
    <text x="440" y="54">SHARED</text>
    <text x="680" y="54">PROTECTED CORE</text>
  </g>

  <g font-size="14" fill="var(--ink-2)" text-anchor="middle">
    <text x="300" y="232">Scoped working copies</text>
    <text x="540" y="232">Team-level analysis</text>
  </g>

  <rect x="700" y="118" width="200" height="54" rx="3" fill="var(--surface)" stroke="var(--dg-line)" stroke-width="2"/>
  <rect x="700" y="190" width="200" height="62" rx="3" fill="var(--surface)" stroke="var(--dg-line)" stroke-width="2"/>
  <g font-size="13.5" fill="var(--ink)" text-anchor="middle">
    <text x="800" y="150">System of record</text>
    <text x="800" y="215">Key store,</text>
    <text x="800" y="234">separate custody</text>
  </g>

  <g fill="none" stroke="var(--dg-line)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M676 170 H648"/><path d="M653 165 l-5 5 l5 5"/>
    <path d="M436 170 H408"/><path d="M413 165 l-5 5 l5 5"/>
    <path d="M131 170 H112"/><path d="M117 165 l-5 5 l5 5"/>
    <path d="M60 250 V330 H246"/><path d="M241 325 l5 5 l-5 5"/>
    <path d="M420 330 H596"/><path d="M591 325 l5 5 l-5 5"/>
    <path d="M750 330 H856 V278"/><path d="M851 283 l5 -5 l5 5"/>
  </g>

  <g stroke="var(--dg-amber)" stroke-width="2.5" fill="var(--dg-amber-fill)">
    <rect x="135" y="151" width="130" height="38" rx="3"/>
    <rect x="250" y="311" width="170" height="39" rx="3"/>
    <rect x="600" y="311" width="150" height="39" rx="3"/>
  </g>
  <g font-size="13.5" fill="var(--ink)" text-anchor="middle">
    <text x="200" y="175">Re-scope</text>
    <text x="335" y="336">De-identify</text>
    <text x="675" y="336">Tokenise</text>
  </g>
</svg>
