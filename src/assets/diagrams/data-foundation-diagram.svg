<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" width="800" height="390" role="img" aria-label="Three access tiers — restricted, shared and a protected core. Data comes in from outside along the bottom, passing de-identification and then tokenisation before reaching the core. Results travel back out through the tiers and through a re-scoping control before leaving. Amber marks every point where data is transformed; denser fill means tighter access.">
  <style>
    svg {
      --ink:#14181D; --ink-2:#4E555F; --ink-3:#888E96; --surface:#FCFCFB;
      --dg-line:#1F4D7A; --dg-fill:#E6EDF3; --dg-sq:#8FAAC4;
      --dg-amber:#9C6F26; --dg-amber-fill:#EFE0C4;
      --dg-z1:#E5EBF1; --dg-z2:#F1F4F6; --dg-z3:#D3DEE9;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --ink:#E9E9E6; --ink-2:#A1A6AD; --ink-3:#70767E; --surface:#191B1F;
        --dg-line:#7FA8CE; --dg-fill:#1A2632; --dg-sq:#4A6580;
        --dg-amber:#C9974A; --dg-amber-fill:#3A2F1B;
        --dg-z1:#1B2531; --dg-z2:#16191E; --dg-z3:#21303E;
      }
    }
    text { font-family: "IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif; }
  </style>

  <rect x="6" y="120" width="80" height="100" rx="3" fill="none" stroke="var(--dg-line)" stroke-width="2.5"/>
  <text x="46" y="176" font-size="17" text-anchor="middle" fill="var(--ink)">External</text>

  <rect x="165" y="60" width="190" height="180" rx="4" fill="var(--dg-z1)" stroke="var(--dg-line)" stroke-width="2"/>
  <rect x="385" y="60" width="170" height="180" rx="4" fill="var(--dg-z2)" stroke="var(--dg-sq)" stroke-width="2"/>
  <rect x="585" y="60" width="205" height="180" rx="4" fill="var(--dg-z3)" stroke="var(--dg-line)" stroke-width="3"/>

  <g font-size="15" letter-spacing="1.6" fill="var(--ink-3)">
    <text x="165" y="46">RESTRICTED</text>
    <text x="385" y="46">SHARED</text>
    <text x="585" y="46">PROTECTED CORE</text>
  </g>

  <g font-size="16" fill="var(--ink-2)" text-anchor="middle">
    <text x="260" y="212">Scoped working copies</text>
    <text x="470" y="212">Team-level analysis</text>
  </g>

  <rect x="598" y="96" width="179" height="54" rx="3" fill="var(--surface)" stroke="var(--dg-line)" stroke-width="2"/>
  <rect x="598" y="160" width="179" height="62" rx="3" fill="var(--surface)" stroke="var(--dg-line)" stroke-width="2"/>
  <g font-size="16" fill="var(--ink)" text-anchor="middle">
    <text x="687" y="129">System of record</text>
    <text x="687" y="185">Key store,</text>
    <text x="687" y="206">separate custody</text>
  </g>

  <g font-size="14" letter-spacing="1.4" fill="var(--ink-3)">
    <text x="6" y="106">RESULTS OUT</text>
    <text x="100" y="289">DATA IN</text>
  </g>

  <g fill="none" stroke="var(--dg-line)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M581 150 H561"/><path d="M566 145 l-5 5 l5 5"/>
    <path d="M381 150 H361"/><path d="M366 145 l-5 5 l5 5"/>
    <path d="M108 150 H90"/><path d="M95 145 l-5 5 l5 5"/>
    <path d="M46 220 V300 H196"/><path d="M191 295 l5 5 l-5 5"/>
    <path d="M350 300 H516"/><path d="M511 295 l5 5 l-5 5"/>
    <path d="M650 300 H730 V248"/><path d="M725 253 l5 -5 l5 5"/>
  </g>

  <g stroke="var(--dg-amber)" stroke-width="2.5" fill="var(--dg-amber-fill)">
    <rect x="112" y="131" width="118" height="38" rx="3"/>
    <rect x="200" y="281" width="150" height="40" rx="3"/>
    <rect x="520" y="281" width="130" height="40" rx="3"/>
  </g>
  <g font-size="17" fill="var(--ink)" text-anchor="middle">
    <text x="171" y="156">Re-scope</text>
    <text x="275" y="307">De-identify</text>
    <text x="585" y="307">Tokenise</text>
  </g>

  <g font-size="14" fill="var(--ink-2)">
    <rect x="165" y="352" width="15" height="15" rx="2" fill="var(--dg-amber-fill)" stroke="var(--dg-amber)" stroke-width="2"/>
    <text x="191" y="365">Data is transformed here</text>
    <rect x="400" y="352" width="15" height="15" rx="2" fill="var(--dg-z3)" stroke="var(--dg-line)" stroke-width="2"/>
    <text x="426" y="365">Denser fill = tighter access</text>
  </g>
</svg>
