<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 214" width="380" height="214" role="img" aria-label="Three separate blocks feeding into one framed panel of three rows: three becoming one.">
  <style>
    svg {
      --ink:#14181D; --ink-2:#4E555F; --ink-3:#888E96; --surface:#FCFCFB;
      --dg-line:#1F4D7A; --dg-fill:#E6EDF3; --dg-sq:#8FAAC4;
      --dg-amber:#9C6F26; --dg-amber-fill:#EFE0C4;
      --dg-z1:#E5EBF1; --dg-z2:#F1F4F6; --dg-z3:#D3DEE9;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --ink:#E9E9E6; --ink-2:#A1A6AD; --ink-3:#70767E; --surface:#191B1F;
        --dg-line:#7FA8CE; --dg-fill:#1A2632; --dg-sq:#4A6580;
        --dg-amber:#C9974A; --dg-amber-fill:#3A2F1B;
        --dg-z1:#1B2531; --dg-z2:#16191E; --dg-z3:#21303E;
      }
    }
    text { font-family: "IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif; }
  </style>
  <text x="30" y="120" font-size="36" text-anchor="middle" fill="var(--dg-line)">3</text>
  <g fill="var(--dg-fill)" stroke="var(--dg-line)" stroke-width="2.5">
    <rect x="62" y="44" width="40" height="34" rx="3"/>
    <rect x="62" y="90" width="40" height="34" rx="3"/>
    <rect x="62" y="136" width="40" height="34" rx="3"/>
  </g>
  <g fill="none" stroke="var(--dg-line)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M102 61 H146 V107"/>
    <path d="M102 107 H180"/>
    <path d="M102 153 H146 V107"/>
    <path d="M174 102 l5 5 l-5 5"/>
  </g>
  <rect x="190" y="52" width="130" height="110" rx="3" fill="var(--dg-fill)" stroke="var(--dg-line)" stroke-width="3"/>
  <g fill="var(--dg-sq)">
